[package]
name = "owhisper-client"
version = "0.0.1"
edition = "2024"

[features]
default = []
local = ["poha-audio-utils"]

[dependencies]
poha-am = { workspace = true }
poha-audio-utils = { workspace = true, optional = true }
poha-cactus-model = { workspace = true }
poha-language = { workspace = true }
poha-observability = { workspace = true }
poha-ws-client = { workspace = true }
soniox = { workspace = true }

openai-transcription = { workspace = true }
owhisper-interface = { workspace = true }

futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json", "multipart"] }
reqwest-middleware = { workspace = true, features = ["json", "multipart"] }
reqwest-tracing = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-stream = { workspace = true }

backon = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
poha-audio-utils = { workspace = true }
poha-data = { workspace = true }

deepgram = { workspace = true, features = ["listen"] }
rodio = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing-subscriber = { workspace = true }
